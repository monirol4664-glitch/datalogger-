<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>EduFlow | Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card card shadow">
        <div class="logo">Edu<span>Flow</span></div>
        <h2>Student Registration</h2>
        <form id="signupForm">
            <input type="text" id="s_name" placeholder="Full Name" required>
            <input type="text" id="s_id" placeholder="Student ID" required>
            <input type="text" id="s_major" placeholder="Major" required>
            <input type="password" id="s_pass" placeholder="Password" required>
            <button type="submit" class="btn-primary full-width">Register</button>
        </form>
        <p class="toggle-text">Already have an account? <a href="index.html">Login</a></p>
    </div>
    <script>
        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth', {
                method: 'POST',
                body: JSON.stringify({ action: 'signup', name: s_name.value, student_id: s_id.value, major: s_major.value, password: s_pass.value });
            });
            if (res.ok) { alert("Account created!"); window.location.href = 'index.html'; }
            else { alert("Signup failed (ID may exist)"); }
        };
    </script>
</body>
</html>
