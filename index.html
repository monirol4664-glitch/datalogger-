<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .form-container {
    background: #ffffff;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 350px;
  }

  .form-container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
  }

  .form-container label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #555;
  }

  .form-container input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }

  .form-container button {
    width: 100%;
    padding: 12px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .form-container button:hover {
    background: #45a049;
  }

  .success-message {
    text-align: center;
    color: green;
    margin-top: 10px;
  }

  .error-message {
    text-align: center;
    color: red;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="form-container">
  <h2>Submit Your Info</h2>
  <form id="myForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">Submit</button>
  </form>
  <div class="success-message" id="successMsg"></div>
  <div class="error-message" id="errorMsg"></div>
</div>

<script>
document.getElementById("myForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = {
    name: this.name.value,
    email: this.email.value
  };

  fetch("https://script.google.com/macros/s/AKfycbz76JFbZAgRHWw7TxXLKk7MrOt7dH5WxlUZsMLa52lrTJbcEgyBXOFSaD8hTMSMcr0-/exec", {
    method: "POST",
    body: JSON.stringify(formData)
  })
  .then(response => response.json())
  .then(data => {
    if(data.status === "success") {
      document.getElementById("successMsg").textContent = "Data saved successfully!";
      document.getElementById("errorMsg").textContent = "";
      this.reset();
    } else {
      document.getElementById("errorMsg").textContent = "Error: " + data.message;
      document.getElementById("successMsg").textContent = "";
    }
  })
  .catch(error => {
    document.getElementById("errorMsg").textContent = "Error: " + error;
    document.getElementById("successMsg").textContent = "";
  });
});
</script>

</body>
</html>
