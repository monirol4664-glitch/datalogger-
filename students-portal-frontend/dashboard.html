<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova | Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-view">
    <nav class="portal-nav">
        <span>NOVA — PORTAL</span>
        <div class="user-info">
            <span id="user-display">ID: AUTHENTICATING...</span>
            <a href="#" onclick="logout()" style="margin-left: 20px; color: var(--accent);">LOGOUT</a>
        </div>
    </nav>

    <main class="grid-container">
        <header class="hero-header">
            <h1 class="welcome-text">WELCOME,<br><span id="student-name">...</span>.</h1>
            <p class="current-date" id="date-display"></p>
        </header>

        <section class="portal-section research">
            <h2>RESEARCH PROJECTS</h2>
            <div id="research-list" class="list-container">
                <p class="loading-text">SYNCING ARCHIVES...</p>
            </div>
        </section>

        <section class="portal-section courses">
            <h2>COURSE PORTAL</h2>
            <ul id="course-grid" class="course-grid">
                </ul>
        </section>

        <section class="portal-section life">
            <h2>STUDENT LIFE</h2>
            <div class="announcement-box">
                <p><strong>ANNUAL SYMPOSIUM:</strong> MARCH 28TH</p>
                <p>Invitations have been dispatched to your institutional portal.</p>
            </div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
