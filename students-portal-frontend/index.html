<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Portal | Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="editorial-container">
        <section id="auth-section">
            <h1 class="mega-title">NOVA<br>INSTITUTE</h1>
            <div class="form-wrapper">
                <div class="tabs">
                    <button onclick="showTab('login')">Login</button>
                    <button onclick="showTab('register')">Enroll</button>
                </div>
                
                <form id="portal-form">
                    <input type="email" id="email" placeholder="Institutional Email" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="submit-btn">Enter Portal —></button>
                </form>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
