<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Institute | Access Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="editorial-container">
        <section id="auth-section">
            <header class="hero-header">
                <h1 class="mega-title">NOVA<br>INSTITUTE</h1>
                <p class="subtitle">ARCHIVE & PORTAL ACCESS</p>
            </header>

            <div class="form-wrapper">
                <div class="tabs">
                    <button id="tab-login" class="active" onclick="switchTab('login')">LOGIN</button>
                    <button id="tab-reg" onclick="switchTab('register')">ENROLL</button>
                </div>
                
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Institutional Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">ENTER PORTAL —></button>
                </form>

                <form id="reg-form" style="display: none;">
                    <input type="text" id="reg-name" placeholder="Full Name" required>
                    <input type="email" id="reg-email" placeholder="Preferred Email" required>
                    <input type="password" id="reg-password" placeholder="Create Password" required>
                    <button type="submit" class="submit-btn">BEGIN ENROLLMENT —></button>
                </form>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
