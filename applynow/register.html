<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Horizon State</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        h2 { font-family: 'Playfair Display', serif; }
        
        .fade-in-page { 
            animation: fadeInPage 0.6s ease-out forwards; 
        }
        @keyframes fadeInPage { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

    <nav class="bg-white border-b p-6">
        <div class="max-w-7xl mx-auto">
            <a href="../index.html" class="text-2xl font-bold text-indigo-900 tracking-tight hover:opacity-80 transition">HORIZON STATE</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-6 py-12 fade-in-page">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-10 border border-slate-100">
            <div class="text-center mb-8">
                <h2 class="text-3xl text-indigo-900 mb-2">Start Application</h2>
                <p class="text-slate-500 text-sm">Join the Class of 2030</p>
            </div>

            <form action="#" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">First Name</label>
                        <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition bg-slate-50/50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Last Name</label>
                        <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition bg-slate-50/50 focus:bg-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Email</label>
                    <input type="email" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition bg-slate-50/50 focus:bg-white">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Password</label>
                    <input type="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition bg-slate-50/50 focus:bg-white">
                </div>
                
                <div class="flex items-start space-x-3 py-2">
                    <input type="checkbox" class="mt-1 rounded text-indigo-600 border-slate-300">
                    <span class="text-[11px] text-slate-500 leading-tight">I agree to the <a href="#" class="underline">Privacy Policy</a> and consent to receive admissions updates.</span>
                </div>

                <button type="submit" class="w-full bg-indigo-900 text-white font-bold py-4 rounded-xl hover:bg-indigo-800 transition-all active:scale-[0.98] shadow-lg shadow-indigo-100">
                    Create Account
                </button>
            </form>

            <div class="mt-8 text-center border-t border-slate-100 pt-6">
                <p class="text-slate-600 text-sm">
                    Already have an account? 
                    <a href="login.html" class="text-indigo-600 font-bold hover:underline ml-1">Sign in here</a>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
